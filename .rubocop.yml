require:
  - rubocop-rails

inherit_gem:
  rubocop-github:
    - config/default.yml
    - config/rails.yml

AllCops:
  TargetRubyVersion: 3.3
  # Keep the opt-in cop policy used by the previous GitHub configuration.
  DisabledByDefault: true

Performance:
  Enabled: true

Style/FrozenStringLiteralComment:
  Exclude:
    - db/schema.rb

Rails/HelperInstanceVariable:
  Enabled: false

Rails/TimeZone:
  Enabled: false

GitHub/InsecureHashAlgorithm:
  Enabled: false

# Preserve the previous configuration's formatting policy during the Ruby upgrade.
Layout/IndentationConsistency:
  Enabled: false

Layout/IndentationWidth:
  Enabled: false

Style/HashSyntax:
  EnforcedShorthandSyntax: never
